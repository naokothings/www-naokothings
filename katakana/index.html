<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇯🇵</text></svg>">
  <title>Katakana Chart & Flashcards 🇯🇵</title>
  <style>
    :root{
      --bg:#fafafa; --panel:#fff; --border:#e6e6e6; --text:#111;
      --muted:#555; --pill:#f3f3f3; --green:#1f8a4c;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:var(--bg); color:var(--text);
    }

    /* Seamless Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 0 20px; /* Added spacing from the very top */
      background: transparent; 
      border: none;
      position: relative;
      z-index: 1000;
    }

    .content-area { padding: 0 20px 20px 20px; max-width: 1200px; margin: 0 auto; }
    h1 { margin: 10px 0 25px; font-size: 26px; text-align: center; }

    /* Settings Dropdown */
    .settings-dropdown {
      position: absolute; top: 65px; right: 20px;
      width: 250px; padding: 15px; background: #fff;
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: none; z-index: 1001;
    }
    .settings-dropdown.show { display: block; }

    .panel{
      background:var(--panel); border:1px solid var(--border);
      border-radius:12px; padding:14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn{
      border: 1px solid #ddd; background:#fff;
      border-radius:10px; padding:8px 12px; cursor:pointer; font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover{ background:#f6f6f6; }
    
    .btn-circle {
      border-radius: 50%; width: 44px; height: 44px; 
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; padding: 0;
    }

    .btn-green{
      border-color: transparent; background: var(--green);
      color:#fff; font-weight:600; padding:10px 16px; border-radius:12px;
    }
    .pill{
      background:var(--pill); border:1px solid #eee;
      border-radius:999px; padding:6px 12px; font-size:12px;
      color:#222; display:inline-flex; gap:8px; align-items:center;
    }

    .select-wrap{
      display:grid; grid-template-columns: 1fr 320px;
      gap:16px; align-items:start;
    }

    .grid{
      display:grid; gap:6px;
      grid-template-columns: repeat(11, 1fr) 50px;
      user-select:none;
    }
    .hdr, .rowhdr{
      font-weight:700; text-align:center; padding:10px 0;
      border-radius:10px; border:1px solid #eee; background:#e0e0e0;
      cursor:pointer;
    }
    
    .cell{
      min-height:60px; border:1px solid #eee; border-radius:12px;
      background:#fff; display:grid; place-items:center; cursor:pointer;
      padding:6px 4px;
    }
    .cell.selected{ background:#111; color:#fff; border-color:#111; }
    .kana{ font-size:22px; }
    .romaji{ font-size:11px; opacity:.7; }
    .hidden{ display:none !important; }

    /* Fun Mode Colors */
    .fun-mode .hdr[data-col="10"] { background:#ff000d !important; color:#fff; }
    .fun-mode .cell.selected[data-col="10"] { background:#ffe5e6 !important; border-color:#ff000d !important; color:#111; }
    .fun-mode .hdr[data-col="9"] { background:#ff5e00 !important; color:#fff; }
    .fun-mode .cell.selected[data-col="9"] { background:#fff3eb !important; border-color:#ff5e00 !important; color:#111; }
    .fun-mode .hdr[data-col="8"] { background:#ff9d00 !important; color:#fff; }
    .fun-mode .cell.selected[data-col="8"] { background:#fff8eb !important; border-color:#ff9d00 !important; color:#111; }
    .fun-mode .hdr[data-col="7"] { background:#ffd000 !important; color:#111; }
    .fun-mode .cell.selected[data-col="7"] { background:#fffaf5 !important; border-color:#ffd000 !important; color:#111; }
    .fun-mode .hdr[data-col="6"] { background:#a6ff00 !important; color:#111; }
    .fun-mode .cell.selected[data-col="6"] { background:#f1ffcc !important; border-color:#a6ff00 !important; color:#111; }
    .fun-mode .hdr[data-col="5"] { background:#00ff33 !important; color:#111; }
    .fun-mode .cell.selected[data-col="5"] { background:#cafcd4 !important; border-color:#00ff33 !important; color:#111; }
    .fun-mode .hdr[data-col="4"] { background:#00fff2 !important; color:#111; }
    .fun-mode .cell.selected[data-col="4"] { background:#c4fffc !important; border-color:#00fff2 !important; color:#111; }
    .fun-mode .hdr[data-col="3"] { background:#2bc7ff !important; color:#111; }
    .fun-mode .cell.selected[data-col="3"] { background:#eaf6ff !important; border-color:#0288f5 !important; color:#111; }
    .fun-mode .hdr[data-col="2"] { background:#1d0fdb !important; color:#fff; }
    .fun-mode .cell.selected[data-col="2"] { background:#e8e7fc !important; border-color:#1d0fdb !important; color:#111; }
    .fun-mode .hdr[data-col="1"] { background:#8000ff !important; color:#fff; }
    .fun-mode .cell.selected[data-col="1"] { background:#f2e5ff !important; border-color:#8000ff !important; color:#111; }
    .fun-mode .hdr[data-col="0"] { background:#991567 !important; color:#fff; }
    .fun-mode .cell.selected[data-col="0"] { background:#f9edf5 !important; border-color:#991567 !important; color:#111; }
  </style>
</head>

<body>
  <div class="top-bar">
    <button class="btn btn-circle" {
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1; /* Prevents text-alignment shifts */
  padding: 0;    /* Ensures the circle stays a perfect circle */
} onclick="window.location.href='https://www.justnaokothings.com'">🏠</button>

    <button class="btn btn-circle" id="gearBtn">⚙️</button>
  </div>

  <div id="settingsPanel" class="settings-dropdown">
    <div style="font-weight: bold; margin-bottom: 10px;">Settings</div>
    <label style="display:block; margin-bottom:10px; font-size:13px; cursor:pointer;"><input type="checkbox" id="strictMode" checked /> Strict Hepburn</label>
    <label style="display:block; font-size:13px; cursor:pointer;"><input type="checkbox" id="funModeToggle" checked /> Fun Mode 🌈</label>
  </div>

  <div class="content-area">
    <div id="selectionScreen">
      <h1>Katakana Chart → Flashcards</h1>
      <div class="select-wrap">
        <div class="panel">
          <div class="row" style="justify-content:space-between; margin-bottom: 15px;">
            <div class="row">
              <button class="btn" id="selectAll">Select all</button>
              <button class="btn" id="clearAll">Clear</button>
            </div>
            <button class="btn btn-green" id="startBtn">START SESSION</button>
          </div>
          <div id="chart"></div>
        </div>
        <div class="panel">
          <div class="pill">Selected: <b id="selectedCount">0</b></div>
          <div id="summary" style="margin-top:20px; font-size:13px; color:#666;">Choose characters to practice.</div>
        </div>
      </div>
    </div>

    <div id="flashScreen" class="hidden" style="max-width: 600px; margin: 0 auto;">
      <div class="panel" style="text-align:center;">
        <div class="row" style="justify-content:center; margin-bottom:20px;">
          <div class="pill">Correct: <b id="statCorrect">0</b></div>
          <div class="pill">Incorrect: <b id="statIncorrect">0</b></div>
        </div>
        <div id="bigKana" style="font-size:120px; margin: 20px 0;">—</div>
        <input id="answerInput" type="text" placeholder="Type romaji..." style="width:80%; padding:15px; border-radius:12px; border:1px solid #ddd; font-size:20px; text-align:center;" autocomplete="off" />
        <div id="status" style="margin-top:20px; height:24px; font-weight:bold;"></div>
        <button class="btn" id="endBtn" style="margin-top:30px; width:100%; padding: 12px;">END SESSION</button>
      </div>
    </div>
  </div>

<script>
const chartRows = [
  { rowLabel: '',  cells: [ {k:'ア', a:['a']},{k:'イ', a:['i']},{k:'ウ', a:['u']},{k:'エ', a:['e']},{k:'オ', a:['o']} ] },
  { rowLabel: 'K', cells: [ {k:'カ', a:['ka']},{k:'キ', a:['ki']},{k:'ク', a:['ku']},{k:'ケ', a:['ke']},{k:'コ', a:['ko']} ] },
  { rowLabel: 'S', cells: [ {k:'サ', a:['sa']},{k:'シ', a:['shi','si']},{k:'ス', a:['su']},{k:'セ', a:['se']},{k:'ソ', a:['so']} ] },
  { rowLabel: 'T', cells: [ {k:'タ', a:['ta']},{k:'チ', a:['chi','ti']},{k:'ツ', a:['tsu','tu']},{k:'テ', a:['te']},{k:'ト', a:['to']} ] },
  { rowLabel: 'N', cells: [ {k:'ナ', a:['na']},{k:'ニ', a:['ni']},{k:'ヌ', a:['nu']},{k:'ネ', a:['ne']},{k:'ノ', a:['no']} ] },
  { rowLabel: 'H', cells: [ {k:'ハ', a:['ha']},{k:'ヒ', a:['hi']},{k:'フ', a:['fu','hu']},{k:'ヘ', a:['he']},{k:'ホ', a:['ho']} ] },
  { rowLabel: 'M', cells: [ {k:'マ', a:['ma']},{k:'ミ', a:['mi']},{k:'ム', a:['mu']},{k:'メ', a:['me']},{k:'モ', a:['mo']} ] },
  { rowLabel: 'Y', cells: [ {k:'ヤ', a:['ya']}, null, {k:'ユ', a:['yu']}, null, {k:'ヨ', a:['yo']} ] },
  { rowLabel: 'R', cells: [ {k:'ラ', a:['ra']},{k:'リ', a:['ri']},{k:'ル', a:['ru']},{k:'レ', a:['re']},{k:'ロ', a:['ro']} ] },
  { rowLabel: 'W', cells: [ {k:'ワ', a:['wa']}, null, null, null, {k:'ヲ', a:['wo','o']} ] },
  { rowLabel: 'N*', cells: [ {k:'ン', a:['n']}, null, null, null, null ] },
];

const uiColumnOrder = ['N*','W','R','Y','M','H','N','T','S','K',''];
const selected = new Set();
let deck = [], current = null, statCorrect = 0, statIncorrect = 0;

function updateFunMode() {
  const isFun = document.getElementById('funModeToggle').checked;
  document.body.classList.toggle('fun-mode', isFun);
}

function renderChart() {
  const chartEl = document.getElementById('chart');
  chartEl.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';

  uiColumnOrder.forEach((lbl, uiColIdx) => {
    const h = document.createElement('div');
    h.className = 'hdr';
    h.dataset.col = uiColIdx;
    h.textContent = (lbl === 'N*') ? 'ン' : (lbl === '' ? '∅' : lbl);
    h.onclick = () => {
      const rowObj = chartRows.find(r => r.rowLabel === lbl);
      const rIdx = chartRows.indexOf(rowObj);
      let allIn = true;
      for(let i=0; i<5; i++) if(rowObj.cells[i] && !selected.has(`${rIdx}-${i}`)) allIn = false;
      for(let i=0; i<5; i++) if(rowObj.cells[i]) allIn ? selected.delete(`${rIdx}-${i}`) : selected.add(`${rIdx}-${i}`);
      updateCounts(); renderChart();
    };
    grid.appendChild(h);
  });

  const corner = document.createElement('div');
  corner.className = 'rowhdr';
  corner.style.background = 'transparent';
  corner.style.border = 'none';
  grid.appendChild(corner);

  ['A','I','U','E','O'].forEach((vowel, vIdx) => {
    uiColumnOrder.forEach((lbl, uiColIdx) => {
      const rowObj = chartRows.find(r => r.rowLabel === lbl);
      const cell = rowObj.cells[vIdx];
      const d = document.createElement('div');
      if (!cell) {
        d.className = 'cell empty'; d.textContent = '—'; d.style.opacity = '0.3'; d.style.cursor = 'default';
      } else {
        const rIdx = chartRows.indexOf(rowObj);
        const key = `${rIdx}-${vIdx}`;
        d.className = 'cell' + (selected.has(key) ? ' selected' : '');
        d.dataset.col = uiColIdx;
        d.innerHTML = `<div class="kana">${cell.k}</div><div class="romaji">${cell.a[0]}</div>`;
        d.onclick = () => { selected.has(key) ? selected.delete(key) : selected.add(key); updateCounts(); renderChart(); };
      }
      grid.appendChild(d);
    });
    const rh = document.createElement('div');
    rh.className = 'rowhdr'; rh.textContent = vowel;
    grid.appendChild(rh);
  });
  chartEl.appendChild(grid);
}

function updateCounts() { document.getElementById('selectedCount').textContent = selected.size; }

document.getElementById('selectAll').onclick = () => {
    chartRows.forEach((r, rIdx) => r.cells.forEach((c, cIdx) => { if(c) selected.add(`${rIdx}-${cIdx}`); }));
    updateCounts(); renderChart();
};

document.getElementById('clearAll').onclick = () => {
    selected.clear(); updateCounts(); renderChart();
};

document.getElementById('startBtn').onclick = () => {
  if (selected.size === 0) return;
  deck = Array.from(selected).map(k => {
    const [r,c] = k.split('-').map(Number);
    return { kana: chartRows[r].cells[c].k, answers: chartRows[r].cells[c].a };
  });
  document.getElementById('selectionScreen').classList.add('hidden');
  document.getElementById('flashScreen').classList.remove('hidden');
  drawNextCard();
};

function drawNextCard() {
  if (deck.length === 0) { location.reload(); return; }
  current = deck.shift();
  document.getElementById('bigKana').textContent = current.kana;
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').focus();
  document.getElementById('status').textContent = '';
}

document.getElementById('answerInput').onkeydown = (e) => {
  if(e.key === 'Enter') {
    const val = e.target.value.toLowerCase().trim();
    if(current.answers.includes(val)) {
      statCorrect++;
      document.getElementById('status').textContent = '✅ Correct!';
      document.getElementById('status').style.color = 'green';
      setTimeout(drawNextCard, 500);
    } else {
      statIncorrect++;
      document.getElementById('status').textContent = `❌ It's ${current.answers[0]}`;
      document.getElementById('status').style.color = 'red';
    }
    document.getElementById('statCorrect').textContent = statCorrect;
    document.getElementById('statIncorrect').textContent = statIncorrect;
  }
};

document.getElementById('gearBtn').onclick = () => document.getElementById('settingsPanel').classList.toggle('show');
document.getElementById('funModeToggle').onchange = updateFunMode;
document.getElementById('endBtn').onclick = () => location.reload();

// Initialize
renderChart();
updateFunMode();
</script>
</body>
</html>
