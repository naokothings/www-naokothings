<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create custom flash cards and study them in randomized sessions.">
  <title>Flash Card Maker | Just Naoko Things</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📇%3C/text%3E%3C/svg%3E">
  <style>
    :root{--ivory:#D1EDFF;--paper:#fffdf9;--navy:#101d3b;--blue:#1757d7;--blue-dark:#1047b8;--muted:#626a79;--line:#d2cabd;--red:#c8483c;--green:#18794e}
    *{box-sizing:border-box}html{background:var(--ivory)}body{margin:0;background:var(--ivory);color:var(--navy);font-family:Arial,Helvetica,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}
    .builder-screen{min-height:100vh;padding:0 4vw 64px}.builder-header{height:104px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;position:sticky;top:0;z-index:10;background:var(--ivory)}.home-button,.settings-button{width:52px;height:52px;border:2px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:6px;display:grid;place-items:center;font-size:24px;text-decoration:none;transition:.16s ease}.home-button{justify-self:start}.home-button:hover,.settings-button:hover{background:#eaf0ff}.settings-button{justify-self:end}.header-begin{justify-self:center;width:220px;height:52px}.clear-wrap{position:relative;margin:0 0 28px}.clear-all{min-height:46px;padding:0 17px;border:1px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:5px;font-size:12px;font-weight:800;letter-spacing:.06em}.clear-all:hover{background:#eaf0ff}.clear-confirm{position:absolute;z-index:5;top:56px;left:0;width:260px;padding:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 34px #101d3b1c;display:none;grid-template-columns:1fr 1fr;gap:10px;border-radius:6px}.clear-confirm.open{display:grid}.clear-confirm strong{grid-column:1/-1;font-family:Georgia,serif;font-size:21px}.clear-confirm button{border:1px solid var(--line);background:var(--paper);padding:9px;border-radius:4px}.clear-confirm .yes{background:var(--blue);border-color:var(--blue);color:#fff}.settings-panel{position:absolute;z-index:5;top:84px;right:0;width:270px;padding:24px;background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 34px #101d3b1c;border-radius:6px;display:none}.settings-panel.open{display:block}.settings-panel h2{font-family:Georgia,serif;margin:0 0 18px}.settings-panel label{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:600}.settings-panel input{width:18px;height:18px;accent-color:var(--blue)}
    .builder-layout{max-width:1330px;margin:46px auto 0}.deck-toolbar{margin:0 0 34px;display:flex;align-items:end;gap:10px;flex-wrap:wrap}.deck-name-wrap{display:flex;flex-direction:column;gap:8px;width:100%;margin-bottom:10px}.deck-name-wrap label{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.deck-name-wrap input{width:100%;height:82px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 22px;color:var(--navy);font:500 clamp(32px,4vw,52px)/1 Georgia,serif;outline:none}.deck-name-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1757d722}.toolbar-button{height:46px;border:1px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:5px;padding:0 15px;font-size:12px;font-weight:800;letter-spacing:.06em}.toolbar-button.primary{background:var(--paper);color:var(--blue)}.toolbar-button:hover,.toolbar-button.primary:hover{background:#eaf0ff}.deck-status{width:100%;min-height:24px;color:var(--muted);font-size:13px;transition:.15s ease}.deck-status.saved{color:var(--green);font-size:19px;font-weight:800}.column-headings{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-left:160px;font-size:15px;font-weight:800;letter-spacing:.08em;color:#4f5666;margin-bottom:14px}.column-headings.has-stat{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 220px}.card-row{display:grid;grid-template-columns:128px minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:18px;position:relative;align-items:start}.card-row.has-stat{grid-template-columns:128px minmax(0,1fr) minmax(0,1fr) 220px}.row-tools{min-height:58px;display:flex;align-items:center;gap:12px;color:var(--muted)}.delete-row,.drag-handle{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.delete-row{color:var(--red);font-size:35px;font-weight:300;line-height:1}.delete-row:hover{background:#f9e4df}.drag-handle{color:#747b89;font-size:23px;cursor:grab}.drag-handle:hover,.drag-handle:focus{background:#ebe5da;color:var(--navy)}.drag-handle:active{cursor:grabbing}.row-number{font-size:18px}.card-row textarea{resize:none;overflow:hidden;min-height:58px;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:14px 18px;color:#16191f;font-size:18px;line-height:1.55;outline:none;transition:border-color .15s,box-shadow .15s}.card-row textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1757d722}.card-row textarea::placeholder{color:#868c99}.row-stat{min-height:58px;border-left:3px solid var(--blue);background:#fffdf9aa;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;color:var(--muted);font-size:13px}.row-stat strong{color:var(--navy);font-size:18px}.session-summary{margin:0 0 28px 160px;border:1px solid var(--line);background:var(--paper);padding:16px 20px;display:flex;gap:28px;color:var(--muted)}.session-summary strong{color:var(--navy);font-size:20px;margin-right:4px}.begin-row{margin-left:160px;display:flex;align-items:center;gap:16px;color:var(--muted)}.begin{width:174px;height:72px;color:#fff;background:var(--blue);border:0;border-radius:6px;letter-spacing:.08em;font-weight:800;font-size:18px;transition:.16s ease}.begin:hover:not(:disabled){background:var(--blue-dark);transform:translateY(-1px)}.begin:disabled{opacity:.45;cursor:not-allowed}
    .modal-backdrop{position:fixed;inset:0;z-index:20;background:#101d3b66;display:none;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal{width:min(520px,100%);max-height:80vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:26px;box-shadow:0 20px 60px #101d3b38}.modal h2{font:500 30px Georgia,serif;margin:0 0 10px}.modal>p{color:var(--muted);line-height:1.5}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}.saved-deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line);padding:14px 0;align-items:center}.saved-deck strong{overflow-wrap:anywhere}.saved-deck small{display:block;color:var(--muted);margin-top:3px}.saved-deck-actions{display:flex;gap:6px}.saved-deck-actions button{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:4px;font-size:12px}.saved-deck-actions .danger{color:var(--red)}
    .study-screen{min-height:100vh;display:none;flex-direction:column;padding:0 5vw 42px}.study-screen.active{display:flex}.study-top{min-height:92px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}.mini-brand{font-weight:800;letter-spacing:.11em;font-size:13px}.timer{justify-self:center;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:11px 22px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.08em}.card-count{justify-self:end;color:var(--muted)}.study-workspace{width:min(1040px,100%);margin:auto;padding:54px 0}.prompt-card{background:var(--paper);border:1px solid var(--line);min-height:220px;padding:48px;display:grid;place-items:center;text-align:center;font:500 clamp(30px,4vw,54px)/1.25 Georgia,serif;box-shadow:0 10px 36px #101d3b0d}.answer-row{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px;align-items:end}.answer-side label{display:block;font-size:13px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}.answer-side input,.revealed-answer>div{width:100%;min-height:72px;border:1px solid var(--line);background:var(--paper);padding:19px 22px;font-size:19px;border-radius:6px;color:#171a20}.answer-side input:focus{outline:3px solid #1757d722;border-color:var(--blue)}.answer-side input.correct{border:2px solid var(--green);background:#eefaf3;color:var(--green)}.answer-side input.wrong{border:2px solid var(--red);background:#fff2ef;color:var(--red)}.revealed-answer.correct-text>div{border:2px solid var(--green);background:#eefaf3;color:var(--green)}.revealed-answer{display:none}.space-hint{text-align:center;color:var(--blue);font-weight:700;margin:30px 0 0;display:none}.end-session{align-self:center;border:0;background:#6c7280;color:#fff;font-weight:800;letter-spacing:.08em;border-radius:5px;padding:16px 24px}.end-session:hover{background:#565c68}.hidden{display:none!important}
    @media(max-width:900px){.card-row,.card-row.has-stat{grid-template-columns:70px 1fr;gap:14px}.card-row textarea{grid-column:2}.row-tools{grid-row:1/3}.row-stat{grid-column:2}.column-headings{display:none}.begin-row{margin-left:84px}.session-summary{margin-left:84px;flex-wrap:wrap}.answer-row{grid-template-columns:1fr}}
    @media(max-width:560px){.builder-screen{padding:0 18px 40px}.header-begin{width:160px;font-size:14px}.card-row{grid-template-columns:48px 1fr}.row-tools{flex-direction:column;gap:3px}.row-number{display:none}.study-screen{padding:0 18px 30px}.mini-brand,.card-count{font-size:10px}.prompt-card{padding:28px;min-height:180px}}
    .begin.header-begin{justify-self:center;width:220px;height:52px}
    .builder-header{height:78px}
    .builder-layout{margin-top:22px}
    .settings-panel{top:68px}
    @media(max-width:560px){.begin.header-begin{width:160px;height:52px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="builder-screen" id="builderScreen">
    <header class="builder-header">
      <a class="home-button" href="https://www.justnaokothings.com/" aria-label="Home" title="Home">🏠</a>
      <button class="begin header-begin" id="begin" type="button" disabled title="Add a front and answer to begin">BEGIN</button>
      <button class="settings-button" id="settingsButton" type="button" aria-expanded="false" aria-label="Settings">⚙</button>
      <aside class="settings-panel" id="settingsPanel">
        <h2>Settings</h2>
        <label><input id="requireAnswer" type="checkbox" checked>Require answer</label>
        <label><input id="giveStats" type="checkbox" checked>Give stats</label>
        <label><input id="useTimer" type="checkbox" checked>Use timer</label>
        <label><input id="goInOrder" type="checkbox">Go in order</label>
      </aside>
    </header>
    <div class="builder-layout" id="builder">
      <section class="deck-builder">
        <div class="deck-toolbar">
          <div class="deck-name-wrap"><label for="deckName">DECK NAME</label><input id="deckName" placeholder="Name this deck" maxlength="80"></div>
          <button class="toolbar-button primary" id="saveDeck" type="button">SAVE DECK</button>
          <button class="toolbar-button" id="downloadCsv" type="button">DOWNLOAD CSV</button>
          <button class="toolbar-button" id="importCsv" type="button">IMPORT CSV</button>
          <button class="toolbar-button" id="myDecks" type="button">MY DECKS</button>
          <input class="hidden" id="csvFile" type="file" accept=".csv,text/csv">
          <span class="deck-status" id="deckStatus">Your draft is saved automatically in this browser.</span>
        </div>
        <div class="clear-wrap">
          <button class="clear-all" id="newDeck" type="button">NEW DECK</button>
          <button class="clear-all" id="clearAll" type="button">CLEAR DECK</button>
          <div class="clear-confirm" id="clearConfirm" role="dialog" aria-label="Confirm clear deck">
            <strong id="clearPrompt">Clear this deck?</strong><button class="yes" id="confirmYes" type="button">Yes</button><button id="confirmCancel" type="button">Cancel</button>
          </div>
        </div>
        <div class="session-summary hidden" id="sessionSummary"></div>
        <div class="column-headings" id="columnHeadings"><span>FRONT</span><span>BACK / ANSWER</span></div>
        <div id="rows"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop" id="decksModal" role="dialog" aria-modal="true" aria-labelledby="decksTitle">
    <div class="modal"><h2 id="decksTitle">My Decks</h2><p>Saved in this browser. Download CSV backups for anything you don’t want to lose.</p><div id="savedDecksList"></div><div class="modal-actions"><button class="toolbar-button" data-close="decksModal" type="button">CLOSE</button></div></div>
  </div>
  <div class="modal-backdrop" id="importModal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="modal"><h2 id="importTitle">Import flashcards</h2><p id="importMessage"></p><div class="modal-actions"><button class="toolbar-button" id="importReplace" type="button">REPLACE CURRENT</button><button class="toolbar-button primary" id="importAdd" type="button">ADD TO CURRENT</button><button class="toolbar-button" data-close="importModal" type="button">CANCEL</button></div></div>
  </div>

  <main class="study-screen" id="studyScreen">
    <header class="study-top"><span class="mini-brand">FLASH CARDS</span><div class="timer" id="timer">00:00</div><span class="card-count" id="cardCount"></span></header>
    <section class="study-workspace">
      <div class="prompt-card" id="promptCard"></div>
      <form class="answer-row" id="answerForm">
        <div class="answer-side"><label for="studyAnswer">YOUR ANSWER</label><input id="studyAnswer" placeholder="Type your answer and press Enter" autocomplete="off"></div>
        <div class="answer-side revealed-answer" id="revealedAnswer"><label>ANSWER</label><div id="correctAnswer"></div></div>
      </form>
      <p class="space-hint" id="nextHint">Press Enter for the next card</p>
    </section>
    <button class="end-session" id="endSession" type="button">END SESSION</button>
  </main>

  <script>
    (()=>{
      const $=id=>document.getElementById(id);const DRAFT_KEY='jnt-flashcards-draft-v1',DECKS_KEY='jnt-flashcards-decks-v1',SETTINGS_KEY='jnt-flashcards-settings-v1';let nextId=1,cards=[blankCard()],stats={},queue=[],queueIndex=0,revealed=false,elapsed=0,timerId=null,draggedId=null,orderedSession=false,pendingImport=null,baselineSnapshot='';
      function blankCard(){return{id:String(nextId++),front:'',back:''}}
      function completeCards(){return cards.filter(card=>card.front.trim()&&card.back.trim())}
      function normalize(value){return value.trim().toLocaleLowerCase()}
      function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
      function escapeHtml(value){return value.replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]))}
      function ensureBlank(){const nonblank=cards.filter(card=>card.front||card.back);const blank=cards.find(card=>!card.front&&!card.back)||blankCard();cards=[...nonblank,blank]}
      function currentSnapshot(){return JSON.stringify({name:$('deckName').value.trim(),cards:cards.filter(card=>card.front||card.back).map(({front,back})=>({front,back}))})}
      function isDirty(){return currentSnapshot()!==baselineSnapshot}
      function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify({name:$('deckName').value,cards:cards.map(({front,back})=>({front,back})),baselineSnapshot}));if($('deckStatus')?.classList.contains('saved')&&isDirty())setStatus('Draft changed. Click Update Deck to update the saved copy.')}
      function restoreDraft(){try{const draft=JSON.parse(localStorage.getItem(DRAFT_KEY));if(draft&&Array.isArray(draft.cards)){cards=draft.cards.map(card=>({id:String(nextId++),front:String(card.front||''),back:String(card.back||'')}));$('deckName').value=String(draft.name||'');ensureBlank();baselineSnapshot=typeof draft.baselineSnapshot==='string'?draft.baselineSnapshot:''}else baselineSnapshot=currentSnapshot()}catch(error){console.warn('Could not restore draft',error);baselineSnapshot=currentSnapshot()}}
      function savedDecks(){try{return JSON.parse(localStorage.getItem(DECKS_KEY))||{}}catch{return{}}}
      function storeDecks(decks){localStorage.setItem(DECKS_KEY,JSON.stringify(decks))}
      function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify({requireAnswer:$('requireAnswer').checked,giveStats:$('giveStats').checked,useTimer:$('useTimer').checked,goInOrder:$('goInOrder').checked}))}
      function restoreSettings(){try{const value=JSON.parse(localStorage.getItem(SETTINGS_KEY));if(!value)return;['requireAnswer','giveStats','useTimer','goInOrder'].forEach(key=>{if(typeof value[key]==='boolean')$(key).checked=value[key]})}catch(error){console.warn('Could not restore settings',error)}}
      function syncHeight(row){const fields=[...row.querySelectorAll('textarea')];fields.forEach(field=>field.style.height='0px');const height=Math.max(58,...fields.map(field=>field.scrollHeight));fields.forEach(field=>field.style.height=height+'px')}
      function renderRows(){
        const showStats=$('columnHeadings').classList.contains('has-stat');$('rows').innerHTML='';
        cards.forEach((card,index)=>{const row=document.createElement('div');row.className='card-row'+(showStats?' has-stat':'');row.dataset.id=card.id;
          const stat=stats[card.id];const percent=stat&&stat.total?Math.round(stat.correct/stat.total*100):0;
          row.innerHTML=`<div class="row-tools"><button class="delete-row" type="button" aria-label="Delete card ${index+1}">×</button><button class="drag-handle" type="button" draggable="${Boolean(card.front||card.back)}" aria-label="Reorder card ${index+1}. Use arrow keys to move." title="Drag to reorder">⠿</button><span class="row-number">${index+1}</span></div><textarea data-card-input data-key="front" aria-label="Front of card ${index+1}" placeholder="Type the front…">${escapeHtml(card.front)}</textarea><textarea data-card-input data-key="back" aria-label="Answer for card ${index+1}" placeholder="Type the answer…">${escapeHtml(card.back)}</textarea>${showStats?`<div class="row-stat">${stat?`<strong>${stat.correct}/${stat.total}</strong><span>= ${percent}% correct</span>`:'<span>Not seen</span>'}</div>`:''}`;
          row.querySelector('.delete-row').onclick=()=>{cards=cards.filter(item=>item.id!==card.id);ensureBlank();renderRows();updateBegin();saveDraft()};
          const handle=row.querySelector('.drag-handle');handle.addEventListener('dragstart',()=>draggedId=card.id);handle.addEventListener('keydown',event=>{if(event.key==='ArrowUp')nudge(card.id,-1);if(event.key==='ArrowDown')nudge(card.id,1)});
          row.addEventListener('dragover',event=>event.preventDefault());row.addEventListener('drop',()=>reorder(draggedId,card.id));
          row.querySelectorAll('textarea').forEach(field=>{field.addEventListener('input',()=>{card[field.dataset.key]=field.value;syncHeight(row);if(card===cards.at(-1)&&(card.front||card.back)){const key=field.dataset.key,start=field.selectionStart,end=field.selectionEnd;cards.push(blankCard());renderRows();const replacement=document.querySelector(`.card-row[data-id="${card.id}"] textarea[data-key="${key}"]`);if(replacement){replacement.focus();replacement.setSelectionRange(start,end)}}updateBegin();saveDraft()});field.addEventListener('keydown',tabBetweenFields)});
          $('rows').appendChild(row);syncHeight(row);
        })
      }
      function tabBetweenFields(event){if(event.key!=='Tab')return;const fields=[...document.querySelectorAll('textarea[data-card-input]')],index=fields.indexOf(event.currentTarget),next=event.shiftKey?index-1:index+1;if(fields[next]){event.preventDefault();fields[next].focus()}}
      function nudge(id,delta){const index=cards.findIndex(card=>card.id===id),destination=index+delta;if(index<0||destination<0||destination>=cards.length)return;[cards[index],cards[destination]]=[cards[destination],cards[index]];ensureBlank();renderRows();saveDraft()}
      function reorder(from,to){if(!from||from===to)return;const fromIndex=cards.findIndex(card=>card.id===from),toIndex=cards.findIndex(card=>card.id===to);if(fromIndex<0||toIndex<0)return;const[moved]=cards.splice(fromIndex,1);cards.splice(toIndex,0,moved);ensureBlank();renderRows();saveDraft()}
      function updateBegin(){const count=completeCards().length,ready=count>0;$('begin').disabled=!ready;$('begin').textContent=ready?`BEGIN · ${count} CARD${count===1?'':'S'}`:'BEGIN';$('begin').title=ready?`Begin studying ${count} card${count===1?'':'s'}`:'Add a front and answer to begin'}
      function updateSaveButton(){$('saveDeck').textContent=savedDecks()[$('deckName').value.trim()]?'UPDATE DECK':'SAVE DECK'}
      function confirmUnsaved(action){return !isDirty()||confirm(`This draft has changes that haven’t been saved to a named deck. ${action}?`)}
      function begin(){const complete=completeCards();if(!complete.length)return;stats={};orderedSession=$('goInOrder').checked;queue=orderedSession?[...complete]:shuffle(complete);queueIndex=0;elapsed=0;revealed=false;$('builderScreen').classList.add('hidden');$('studyScreen').classList.add('active');$('sessionSummary').classList.add('hidden');$('columnHeadings').classList.remove('has-stat');stopTimer();if($('useTimer').checked){$('timer').classList.remove('hidden');timerId=setInterval(()=>{elapsed++;renderTimer()},1000)}else $('timer').classList.add('hidden');showCard()}
      function showCard(){revealed=false;$('promptCard').textContent=queue[queueIndex].front;$('cardCount').textContent=`Card ${queueIndex+1} of ${queue.length}`;$('studyAnswer').value='';$('studyAnswer').disabled=false;$('studyAnswer').className='';$('revealedAnswer').style.display='none';$('revealedAnswer').classList.remove('correct-text');$('nextHint').style.display='none';requestAnimationFrame(()=>$('studyAnswer').focus())}
      function submit(){if(revealed)return nextCard();const card=queue[queueIndex],answer=$('studyAnswer').value,requires=$('requireAnswer').checked;revealed=true;$('studyAnswer').disabled=true;$('correctAnswer').textContent=card.back;$('revealedAnswer').style.display='block';if(requires){const correct=normalize(answer)===normalize(card.back);$('studyAnswer').classList.add(correct?'correct':'wrong');$('revealedAnswer').classList.toggle('correct-text',correct);const current=stats[card.id]||{correct:0,total:0};current.total++;if(correct)current.correct++;stats[card.id]=current}$('nextHint').style.display='block'}
      function nextCard(){queueIndex++;if(queueIndex>=queue.length){if(!orderedSession)queue=shuffle(queue);queueIndex=0}showCard()}
      function endSession(){stopTimer();$('studyScreen').classList.remove('active');$('builderScreen').classList.remove('hidden');if($('giveStats').checked){const totals=Object.values(stats).reduce((sum,stat)=>({correct:sum.correct+stat.correct,total:sum.total+stat.total}),{correct:0,total:0}),wrong=totals.total-totals.correct,percent=totals.total?Math.round(totals.correct/totals.total*100):0;$('sessionSummary').innerHTML=`<span><strong>${totals.correct}</strong> correct</span><span><strong>${wrong}</strong> wrong</span><span><strong>${percent}%</strong> correct overall</span>`;$('sessionSummary').classList.remove('hidden');$('columnHeadings').classList.add('has-stat');$('columnHeadings').innerHTML='<span>FRONT</span><span>BACK / ANSWER</span><span>SESSION RESULTS</span>'}else{$('sessionSummary').classList.add('hidden');$('columnHeadings').classList.remove('has-stat');$('columnHeadings').innerHTML='<span>FRONT</span><span>BACK / ANSWER</span>'}renderRows()}
      function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}function renderTimer(){const minutes=Math.floor(elapsed/60),seconds=elapsed%60;$('timer').textContent=String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}
      function csvCell(value){return '"'+String(value).replace(/"/g,'""')+'"'}
      function downloadCsv(){const complete=completeCards();if(!complete.length){setStatus('Add at least one complete card before downloading.');return}const csv='\uFEFFFront,Back\r\n'+complete.map(card=>csvCell(card.front)+','+csvCell(card.back)).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a'),safe=($('deckName').value.trim()||'flashcards').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();link.href=url;link.download=(safe||'flashcards')+'.csv';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);setStatus('CSV backup downloaded.')}
      function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const char=text[i];if(quoted){if(char==='"'&&text[i+1]==='"'){cell+='"';i++}else if(char==='"')quoted=false;else cell+=char}else if(char==='"')quoted=true;else if(char===','){row.push(cell);cell=''}else if(char==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=char}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows}
      function importFile(file){const reader=new FileReader();reader.onload=()=>{let rows=parseCsv(String(reader.result||'').replace(/^\uFEFF/,''));if(rows.length&&isHeader(rows[0]))rows=rows.slice(1);const imported=rows.filter(row=>row.some(cell=>String(cell).trim())).map(row=>({front:String(row[0]||''),back:String(row[1]||'')}));if(!imported.length){setStatus('No flashcards were found in that CSV.');return}pendingImport={cards:imported,name:file.name.replace(/\.csv$/i,'')};$('importMessage').textContent=`Found ${imported.length} card${imported.length===1?'':'s'} in “${file.name}.” Replace the current cards or add these to them?`;$('importModal').classList.add('open')};reader.onerror=()=>setStatus('That CSV could not be read.');reader.readAsText(file)}
      function isHeader(row){const a=String(row[0]||'').trim().toLowerCase(),b=String(row[1]||'').trim().toLowerCase();return ['front','question','term'].includes(a)&&['back','answer','definition'].includes(b)}
      function applyImport(replace){if(!pendingImport)return;if(replace&&!confirmUnsaved('Replace it with the imported deck'))return;const imported=pendingImport.cards.map(card=>({id:String(nextId++),...card}));if(replace){cards=imported;$('deckName').value=pendingImport.name;baselineSnapshot=''}else cards=[...cards.filter(card=>card.front||card.back),...imported];ensureBlank();pendingImport=null;$('importModal').classList.remove('open');hideResults();renderRows();updateBegin();updateSaveButton();saveDraft();setStatus(`CSV ${replace?'imported':'added'}.`)}
      function hideResults(){$('sessionSummary').classList.add('hidden');$('columnHeadings').classList.remove('has-stat');$('columnHeadings').innerHTML='<span>FRONT</span><span>BACK / ANSWER</span>'}
      function setStatus(message,saved=false){$('deckStatus').textContent=message;$('deckStatus').classList.toggle('saved',saved)}
      function saveNamedDeck(){const name=$('deckName').value.trim();if(!name){$('deckName').focus();setStatus('Give this deck a name before saving.');return}const deckCards=cards.filter(card=>card.front||card.back).map(({front,back})=>({front,back}));if(!deckCards.length){setStatus('Add at least one card before saving.');return}const decks=savedDecks();decks[name]={cards:deckCards,updatedAt:new Date().toISOString()};storeDecks(decks);baselineSnapshot=currentSnapshot();saveDraft();updateSaveButton();setStatus(`“${name}” saved.`,true)}
      function renderSavedDecks(){const decks=savedDecks(),names=Object.keys(decks).sort((a,b)=>a.localeCompare(b)),list=$('savedDecksList');list.innerHTML=names.length?'':'<p>No saved decks yet.</p>';names.forEach(name=>{const item=document.createElement('div');item.className='saved-deck';item.innerHTML=`<div><strong>${escapeHtml(name)}</strong><small>${decks[name].cards.length} card${decks[name].cards.length===1?'':'s'}</small></div><div class="saved-deck-actions"><button data-action="open" type="button">Open</button><button data-action="rename" type="button">Rename</button><button class="danger" data-action="delete" type="button">Delete</button></div>`;item.querySelector('[data-action="open"]').onclick=()=>openDeck(name);item.querySelector('[data-action="rename"]').onclick=()=>renameDeck(name);item.querySelector('[data-action="delete"]').onclick=()=>deleteDeck(name);list.appendChild(item)})}
      function openDeck(name){if(!confirmUnsaved(`Open “${name}” instead`))return;const deck=savedDecks()[name];if(!deck)return;cards=deck.cards.map(card=>({id:String(nextId++),front:card.front,back:card.back}));ensureBlank();$('deckName').value=name;hideResults();renderRows();updateBegin();baselineSnapshot=currentSnapshot();updateSaveButton();saveDraft();$('decksModal').classList.remove('open');setStatus(`“${name}” opened. Changes won’t update the saved copy until you click Update Deck.`)}
      function renameDeck(oldName){const name=prompt('Rename this deck:',oldName)?.trim();if(!name||name===oldName)return;const decks=savedDecks();if(decks[name]&&!confirm(`Replace the existing deck named “${name}”?`))return;decks[name]=decks[oldName];delete decks[oldName];storeDecks(decks);if($('deckName').value===oldName){$('deckName').value=name;baselineSnapshot=currentSnapshot();saveDraft();updateSaveButton()}renderSavedDecks();setStatus(`Deck renamed to “${name}”.`)}
      function deleteDeck(name){if(!confirm(`Delete the saved deck “${name}”? Your current draft will not be cleared.`))return;const decks=savedDecks();delete decks[name];storeDecks(decks);if($('deckName').value.trim()===name)baselineSnapshot='';updateSaveButton();saveDraft();renderSavedDecks();setStatus(`“${name}” deleted from saved decks.`)}
      function startNewDeck(){if(!confirmUnsaved('Start a new deck'))return;cards=[blankCard()];stats={};$('deckName').value='';hideResults();renderRows();updateBegin();baselineSnapshot=currentSnapshot();updateSaveButton();saveDraft();setStatus('New blank deck started. Your named decks are still saved.')}
      $('newDeck').onclick=startNewDeck;$('clearAll').onclick=()=>{$('clearPrompt').textContent=isDirty()?'Clear these cards? This draft has changes that haven’t been saved.':'Clear all cards from this deck?';$('clearConfirm').classList.add('open')};$('confirmCancel').onclick=()=>$('clearConfirm').classList.remove('open');$('confirmYes').onclick=()=>{cards=[blankCard()];stats={};$('clearConfirm').classList.remove('open');hideResults();renderRows();updateBegin();saveDraft();setStatus(`Cards cleared from ${$('deckName').value.trim()?`“${$('deckName').value.trim()}”`:'this deck'}. The deck name and saved copy were kept.`)};
      $('settingsButton').onclick=()=>{const open=$('settingsPanel').classList.toggle('open');$('settingsButton').setAttribute('aria-expanded',String(open))};['requireAnswer','giveStats','useTimer','goInOrder'].forEach(id=>$(id).addEventListener('change',saveSettings));$('deckName').addEventListener('input',()=>{saveDraft();updateSaveButton()});$('saveDeck').onclick=saveNamedDeck;$('myDecks').onclick=()=>{renderSavedDecks();$('decksModal').classList.add('open')};$('downloadCsv').onclick=downloadCsv;$('importCsv').onclick=()=>$('csvFile').click();$('csvFile').onchange=event=>{const file=event.target.files[0];if(file)importFile(file);event.target.value=''};$('importReplace').onclick=()=>applyImport(true);$('importAdd').onclick=()=>applyImport(false);document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).classList.remove('open'));$('begin').onclick=begin;$('answerForm').onsubmit=event=>{event.preventDefault();submit()};$('endSession').onclick=endSession;window.addEventListener('keydown',event=>{if($('studyScreen').classList.contains('active')&&revealed&&event.key==='Enter'){event.preventDefault();nextCard()}});restoreSettings();restoreDraft();renderRows();updateBegin();updateSaveButton();
    })();
  </script>
