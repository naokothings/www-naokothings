<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NAOKO!</title>
    <link rel="icon" href="https://fav.farm/✨">

    <style>
        body {
            /* Background image configuration */
            background-image: url('index_files/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            /* Fallback color if image fails to load */
            background-color: #FFECBC; 
            
            font-family: "Avenir Book", "Aptos", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }

        h1 {
            font-size: 48pt;
            font-weight: normal;
            margin-bottom: 40px;
            /* Added a slight text shadow to help it pop against a background image */
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .top-row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Top Row Images (285px) */
        .top-row img {
            display: block;
            height: 285px; 
            width: auto;
        }

        /* Katakana Image (250px with shadow and rounded corners) */
        .katakana-img {
            display: block;
            height: 250px; 
            width: auto;
            border-radius: 20px;
            box-shadow: -10px 10px 20px rgba(0, 0, 0, 0.3);
        }

        a {
            text-decoration: none;
            transition: transform 0.2s;
            display: block;
        }

        /* Subtle hover effect for the links */
        a:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <h1>Just Naoko Things</h1>

    <div class="container">
        <div class="top-row">
            <a href="http://www.instagram.com/carrotthedoggie">
                <img src="index_files/carrot_thumbnail.png" alt="A dog lying in the sand">
            </a>
            <a href="http://www.justnaokothings.com/clippy/">
                <img src="index_files/clippy_thumbnail.png" alt="Clippy">
            </a>
        </div>

        <div class="bottom-row">
            <a href="http://www.justnaokothings.com/katakana">
                <img src="index_files/katakana_thumbnail.png" alt="katakana" class="katakana-img">
            </a>
        </div>
    </div>

</body>
</html>
